                    <i class="fa fa-bars text-xl"></i>

        <div class="hidden md:hidden bg-white border-t" id="mobile-menu">
            <div class="container mx-auto px-4 py-4 space-y-3">
                <a href="index.html" class="block text-gray-700">首页</a>
                <a href="overview.html" class="block text-gray-700">项目概述</a>
                <a href="technology.html" class="block text-gray-700">技术方案</a>
                <a href="team.html" class="block text-gray-700">团队介绍</a>

                <a href="contact.html" class="block text-cyan-700 font-semibold">联系我们</a>
            </div>

    <!-- 页面标题 -->
    <section class="bg-gradient-to-r from-cyan-700 to-emerald-700 text-white py-16">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-4xl font-bold mb-4">联系我们</h1>
            <p class="text-xl opacity-90">如有合作意向或技术咨询，欢迎随时联系我们</p>
        </div>
    </section>

    <!-- 联系内容 -->
    <section class="py-16">
        <div class="container mx-auto px-4">
            <div class="max-w-5xl mx-auto">
                <div class="grid md:grid-cols-2 gap-12">
                    <!-- 联系方式 -->
                    <div>
                        <h3 class="text-2xl font-semibold mb-6 text-cyan-700">联系方式</h3>
                        
                        <div class="space-y-6 mb-8">
                            <div class="flex items-start">
                                <div class="text-cyan-700 text-xl mr-4 mt-1">
                                    <i class="fa fa-map-marker"></i>
                                </div>
                                <div>
                                    <h4 class="font-semibold mb-1">公司地址</h4>
                                    <p class="text-gray-700">安徽省马鞍山市皖江工学院水利工程学院科创中心</p>
                                </div>
                            </div>
                            
                            <div class="flex items-start">
                                <div class="text-cyan-700 text-xl mr-4 mt-1">
                                    <i class="fa fa-phone"></i>
                                </div>
                                <div>
                                    <h4 class="font-semibold mb-1">联系电话</h4>
                                    <p class="text-gray-700">0555-1234567</p>
                                </div>
                            </div>
                            
                            <div class="flex items-start">
                                <div class="text-cyan-700 text-xl mr-4 mt-1">
                                    <i class="fa fa-envelope"></i>
                                </div>
                                <div>
                                    <h4 class="font-semibold mb-1">电子邮箱</h4>
                                    <p class="text-gray-700">contact@jiezaoqingyuan.com</p>
                                </div>
                            </div>
                            
                            <div class="flex items-start">
                                <div class="text-cyan-700 text-xl mr-4 mt-1">
                                    <i class="fa fa-clock-o"></i>
                                </div>
                                <div>
                                    <h4 class="font-semibold mb-1">工作时间</h4>
                                    <p class="text-gray-700">周一至周五 9:00-18:00</p>
                                </div>
                            </div>
                        </div>
                        
                        <div>
                            <h4 class="font-semibold mb-4">关注我们</h4>
                            <div class="flex space-x-4">
                                <a href="#" class="w-10 h-10 bg-cyan-700 text-white rounded-full flex items-center justify-center hover:bg-cyan-800 transition-colors">
                                    <i class="fa fa-weixin"></i>
                                </a>
                                <a href="#" class="w-10 h-10 bg-cyan-700 text-white rounded-full flex items-center justify-center hover:bg-cyan-800 transition-colors">
                                    <i class="fa fa-weibo"></i>
                                </a>
                                <a href="#" class="w-10 h-10 bg-cyan-700 text-white rounded-full flex items-center justify-center hover:bg-cyan-800 transition-colors">
                                    <i class="fa fa-github"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 在线咨询表单 -->
                    <div>
                        <h3 class="text-2xl font-semibold mb-6 text-cyan-700">在线咨询</h3>
                        
                        <form id="contactForm" class="space-y-4 bg-white p-6 rounded-xl shadow-md">
                            <div>
                                <label for="name" class="block text-gray-700 mb-1">姓名 *</label>
                                <input type="text" id="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500" required>
                            </div>
                            
                            <div>
                                <label for="email" class="block text-gray-700 mb-1">电子邮箱 *</label>
                                <input type="email" id="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500" required>
                            </div>
                            
                            <div>
                                <label for="phone" class="block text-gray-700 mb-1">联系电话</label>
                                <input type="tel" id="phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500">
                            </div>
                            
                            <div>
                                <label for="subject" class="block text-gray-700 mb-1">咨询主题</label>
                                <select id="subject" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500">
                                    <option value="">请选择咨询主题</option>
                                    <option value="cooperation">商务合作</option>
                                    <option value="technology">技术咨询</option>
                                    <option value="employment">人才招聘</option>
                                    <option value="other">其他问题</option>
                                </select>
                            </div>
                            
                            <div>
                                <label for="message" class="block text-gray-700 mb-1">留言内容 *</label>
                                <textarea id="message" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500" required></textarea>
                            </div>
                            
                            <button type="submit" class="w-full px-6 py-3 bg-cyan-700 text-white font-semibold rounded-lg shadow-md hover:bg-cyan-800 transition-colors">
                                提交留言
                            </button>
                        </form>
                    </div>
                </div>

                <!-- 返回首页按钮 -->
                <div class="text-center mt-12">
                    <a href="index.html" class="inline-block border border-gray-300 text-gray-700 px-8 py-3 rounded-lg font-semibold hover:bg-gray-50 transition-colors">
                        ← 返回首页
                    </a>
                </div>
            </div>
        </div>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-12">
        <div class="container mx-auto px-4 text-center">

            </div>
        </div>

    <script>
        // 移动端菜单切换
        document.getElementById('menu-btn').addEventListener('click', function() {
            document.getElementById('mobile-menu').classList.toggle('hidden');
        });

        // 表单提交处理
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 模拟表单提交
            alert('留言提交成功！我们会尽快与您联系。');
            this.reset();
        });
    </script>
